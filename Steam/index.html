<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-950">
    <div class="bg-gray-800">
        <div class="flex justify-end ml-auto gap-2 mx-64 p-1">
            <button type="button" class="flex bg-lime-600 text-white py-1.5 px-6 text-xs font-medium hover:bg-lime-500">Instalar steam</button>
            <a href="#" class="hover:text-white text-gray-400 text-xs pt-1.5">Iniciar sesion</a>
            <a href="#" class="text-gray-400 text-xs pt-1.5">|</a>
            <a href="#" class="hover:text-white text-gray-400 text-xs pt-1.5">Idioma</a>
        </div>
        <div class="mx-64 pb-6 flex gap-6">
            <img src="/img/logo_steam.svg" alt="Logo steam" class="h-12 w-auto mr-6">
            <a href="#" class="text-gray-400 hover:text-white text-xl pt-1.5 underline uppercase">Tienda</a>
            <a href="#" class="text-gray-400 hover:text-white text-xl pt-1.5 underline uppercase">Comunidad</a>
            <a href="#" class="text-gray-400 hover:text-white text-xl pt-1.5 underline uppercase">Acerca de</a>
            <a href="#" class="text-gray-400 hover:text-white text-xl pt-1.5 underline uppercase">Soporte</a>
        </div>
    </div>
    <div class="bg-slate-700 text-white flex justify-between items-center py-2">
        <div class="ml-64 flex gap-6 py-2">
            <a class="font-sans">Navegar</a>
            <a class="font-sans">Recomendaciones</a>
            <a class="font-sans">Categorias</a>
            <a class="font-sans">Formas de jugar</a>
            <a class="font-sans">Secciones especiales</a>
        </div>
        <div class="flex mr-64">
        <input type="text" placeholder="Buscar en la tienda" class="bg-white/20 text-gray-400 placeholder:text-gray-300 border border-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 py-2 pl-2 pr-60">
        <div class="bg-blue-600 text-white py-2 px-4 border-blue-200">O</div>
        </div>
    </div>
    <div class="flex flex-col justify-center items-center mx-auto">
        <img src="/img/Pragmata.png" alt="Progmata" class="mt-4 w-3/5">
        <img src="/img/Captura de pantalla 2026-05-05 132822.png" alt="evento" class="mt-8 w-3/5">
    </div>
</body>
</html>
