<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname">
    </form>
    <h2>Radio buttons</h2>
    <p>Choose your favorite programming language:</p>
    <form>
        <input type="radio" id="python" name="language" value="Python">
        <label for="python"> Python</label><br>
        <input type="radio" id="javascript" name="language" value="JavaScript">
        <label for="javascript"> JavaScript</label><br>
        <input type="radio" id="java" name="language" value="Java">
        <label for="java"> Java</label><br>
    </form>
    <h2>Checkbox</h2>
    <p>Which type of transport do you use?</p>
    <form>
        <input type="checkbox" id="car" name="transport" value="Car">
        <label for="car"> Car</label><br>
        <input type="checkbox" id="bike" name="transport" value="Bike">
        <label for="bike"> Bike</label><br>
        <input type="checkbox" id="bus" name="transport" value="Bus">
        <label for="bus"> Bus</label><br>
    </form>
    <h2>The Submit Button</h2>
    <form>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <input type="submit" value="Submit">
    </form>
    <h2></h2>
</body>
</html>
