<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <div class="relative w-full h-screen">

    <!-- Imagen de fondo -->
    <img src="/img/Kampala-lead-photo.jpg" alt="Orphans"
      class="absolute inset-0 w-full h-full object-cover">

    <!-- Overlay oscuro -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Navbar -->
    <div class="relative flex items-center pt-6 px-56">

      <!-- Logo -->
      <img src="/img/logo.jpg" alt="Logo WWO" class="h-10 w-10 mr-12">

      <!-- Redes -->
      <div class="flex gap-3">
        <img src="/img/facebook.png" alt="facebook" class="h-7 w-7">
        <img src="/img/insta.webp" alt="instagram" class="h-7 w-7">
        <img src="/img/youtube.jpg" alt="youtube" class="h-7 w-7">
      </div>

      <!-- Links -->
      <div class="ml-auto flex items-center gap-6 text-white font-semibold">
        <a href="#" class="hover:text-violet-300">About</a>
        <a href="#" class="hover:text-violet-300">Stories</a>
        <a href="#" class="hover:text-violet-300">Take action</a>
        <a href="#" class="hover:text-violet-300">Forum</a>
        <a href="#" class="hover:text-violet-300">Resources</a>
        <a href="#" class="hover:text-violet-300">Join</a>

        <!-- Botón Donate (ya no se estira) -->
        <button type="button"
          class="px-5 py-2 rounded-full bg-green-400 text-white hover:bg-white hover:text-green-500 transition">
          Donate
        </button>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="relative px-56 mt-36">

      <h1 class="text-white font-bold text-7xl leading-tight">
        You Can Play A <span class="text-green-400">Vital</span> Role In <br>
        Attaining A World <br>
        Without Orphans
      </h1>

      <!-- Bloque blanco redondeado -->
      <div class="mt-8 bg-white/70 rounded-2xl p-6 shadow-lg max-w-3xl items-center m-auto">
        <p class="text-gray-700 text-2xl leading-relaxed">
          Everything we do together multiplies, so with your participation, millions of children can
          grow up in strong families and know their identity with a loving Heavenly Father.
        </p>
      </div>

    </div>

  </div>
</body>
</html>
