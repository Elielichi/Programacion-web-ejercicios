<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playstation Home</title>
    <script src="/tailwind.js"> </script>
    <script src="playstation.js"></script>
    
</head>
<body>
   <div class="flex items-center bg-[#00439c] px-6 py-3">
        <img src="/imagenes/pregunta1/img/logo.png" alt="logo" class="h-8 w-auto mr-10">
    
        <div class="font-sans text-white flex gap-10">
            <a href="#" class="hover:text-gray-300">Juegos</a>
            <a href="#" class="hover:text-gray-300">PS5</a>
            <a href="#" class="hover:text-gray-300">PS4</a>

        </div>

        <div class="ml-auto">
            <button type="button" class="rounded-xl py-1 px-4 bg-blue-500 text-white font-semibold hover:bg-blue-700">
                Iniciar sesión
            </button>
        </div>
</div>
<div class="relative w-auto h-auto">
    <img id="banner" src="imagenes/pregunta1/img/banner_principal.jpeg" alt="banner principal" class="w-full h-full object-cover">
    <div class="text-white absolute inset-0 justify-center items-start gap-7 p-28">
        <p id="tittle" class= "text-xl font-sans tracking-widest">ASSASSIN'S CREED</p>
        <h1 class="text-6xl uppercase font-bold">BLACK FLAG</h1>
        <h2 class="text-4xl uppercase font-bold mt-3">RESYNCED</h2>
        <p class="mt-3 font-semibold text-4xl">Vuelve a izar la bandera negra</p>

            experiencia optimizada en PS5. Assassin's Creed Black Flag <br>
            Resynced llega a PS5 el 9 de julio.</p>
        <button type="button" class="rounded-3xl py-2 px-6 bg-white text-[#00439c] font-bold text-xl hover:bg-blue-700 w-max mt-6">
            Más información
        </button>
    </div>
</div>
<div class="flex flex-row items-center justify-center gap-4 mt-11 mx-auto">
    <button class="rounded-xl overflow-hidden hover:scale-105 transition cursor-pointer" onclick="ImagenOnClick('Saros')">
        <img src="imagenes/pregunta1/img/saros.webp" alt="Saros" class="w-60 h-50 object-cover">
    </button>
    <button class="rounded-xl overflow-hidden hover:scale-105 transition cursor-pointer" onclick="ImagenOnClick('Pragmata')">

    <button class="rounded-xl overflow-hidden hover:scale-105 transition cursor-pointer" onclick="ImagenOnClick('Assassin Creed')">
        <img src="imagenes/pregunta1/img/assasinscreed.jpeg" alt="Assassin's Creed" class="rounded-xl w-60 h-50 object-cover">
    </button>
    <button class="rounded-xl overflow-hidden hover:scale-105 transition cursor-pointer" onclick="ImagenOnClick('Diablo IV')">
